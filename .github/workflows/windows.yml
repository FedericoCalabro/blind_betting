name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_NO_SYNC: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --no-editable --group build
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Build blind-betting.exe
        run: >-
          uv run pyinstaller --onefile --console --name blind-betting
          --copy-metadata blind-betting --collect-all curl_cffi
          src/blind_betting/__main__.py
      - name: Smoke-test the exe
        run: |
          dist/blind-betting.exe --version
          dist/blind-betting.exe --list --pdf tests/fixtures/palinsesto.pdf --date 2026-10-02
      - name: Try the Windows voice (runners may have no audio)
        continue-on-error: true
        run: |
          uv run python -c "
          import time
          from blind_betting.voice import EngineSpeaker
          voice = EngineSpeaker(125)
          voice.start()
          voice.say('Prova.')
          started = time.monotonic()
          voice.wait(20)
          voice.close()
          assert time.monotonic() - started < 20, 'the engine never finished speaking'
          "
      - uses: actions/upload-artifact@v7
        with:
          name: blind-betting
          path: dist/blind-betting.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/blind-betting.exe
